name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:local
      - name: Package local game
        run: |
          mkdir -p local-package/scripts
          cp -R dist-local local-package/dist-local
          cp scripts/serve.py local-package/scripts/serve.py
          cp "Start Krillion.command" README.md LICENSE local-package/
      - uses: actions/upload-artifact@v4
        with:
          name: krillion-local
          path: local-package/
          retention-days: 30
